<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>PapYá</title>
  </head>
  <body>
    <div id="app"><div id="game"></div></div>
    <div id="orientation-guard" role="dialog" aria-modal="true" aria-labelledby="orientation-title">
      <div class="orientation-phone" aria-hidden="true">↻</div>
      <h1 id="orientation-title">Gira tu celular</h1>
      <p>PapYá se juega en horizontal.</p>
      <button id="orientation-fullscreen" type="button">Pantalla completa</button>
      <p class="orientation-hint">Coloca el celular de lado para continuar.</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
